services:

  traefik:
    container_name: "traefik"
    image: "traefik:v2.10"
    command:
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      - "--entrypoints.websecure.address=:443"
      - "--providers.file.watch=true"
      - "--providers.file.directory=/traefikconf/"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./traefikconf/:/traefikconf/"
      - "/etc/letsencrypt/:/etc/letsencrypt/:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped

  delicalc-host: # deli-calculator.indecol.no
    container_name: delicalc-host
    build:
      context: .
    labels:
      - "traefik.http.routers.delicalc-host.tls=true"
      - "traefik.http.routers.delicalc-host.rule=Host(`deli-calculator.indecol.no`)"
    restart: unless-stopped

    # volumes:
    #   - "./backend/data/:./backend/data/"
