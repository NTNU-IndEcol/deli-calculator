version: "3"

services:
  traefik:
    image: traefik:v2.10
    restart: always
    command:
      - "--api.insecure=true"  # Enable Traefik dashboard (disable in production)
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=bo.huang@ntnu.no"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./letsencrypt:/letsencrypt"
    networks:
      - web

  foodCalculator:
    image: foodcalculator:latest  # Replace with your Docker image
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.foodCalculator.rule=Host(`foodCalculator.ntnu.no`)"
      - "traefik.http.routers.foodCalculator.entrypoints=websecure"
      - "traefik.http.routers.foodCalculator.tls.certresolver=myresolver"
    networks:
      - web

networks:
  web:
    external: true
