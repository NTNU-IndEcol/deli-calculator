<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.1/themes/base/jquery-ui.css">
</head>
<body>
    <header class="header">
        <div class="header-logo"></div>
        <span class="header-title">DELI Calculator</span>
        <nav class="nav-menu">
            <a href="recipes.html">Recipes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search in site">
            <button id="search-btn">🔍</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Calculate Recipe Environmental Impact</h1>
        <p>Paste a recipe URL to analyze its environmental footprint</p>
        <input class="input-box" type="text" id="recipe-url" placeholder="Paste Recipe URL">
        <button class="button button-primary" id="extract-btn">Extract Ingredients</button>
    </section>

    <!-- Recipe Selection -->
    <section class="recipe-selector">
        <h2>Recipe details</h2>
        <select id="ingredient-dropdown">
            <option value="">Choose a ingredient...</option>
        </select>
    </section>

    <!-- Selected Ingredients Table -->
    <section class="selected-ingredients">
        <h3>Selected Ingredients</h3>
        <table id="ingredients-table" border="1">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Ingredient</th>
                    <th>Amount</th>
                    <th>Unit</th>
                    <th>Source</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ingredients-table-body">
                <!-- Ingredients will be dynamically added here -->
            </tbody>
        </table>
    </section>

    <!-- Calculation Controls -->
    <section class="calculation-controls">
        <button class="button button-primary" id="calculate-selected">
            Calculate Environmental Impact
        </button>
    </section>

    <!-- Results Display -->
    <section id="calculation-results">
        <!-- Results will be dynamically inserted here -->
    </section>

    <footer class="footer">
        <p>© 2025 DELI Calculator. All rights reserved. Privacy Policy | Terms of Use</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
