<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Carbon Footprint Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Food Carbon Footprint Calculator</h1>
    <form id="calculator-form">
        <label for="ingredient">Ingredient:</label>
        <input type="text" id="ingredient" name="ingredient" required>

        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" required>

        <label for="unit">Unit:</label>
        <select id="unit" name="unit" required>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="lb">lb</option>
        </select>

        <label for="import-location">Import Location:</label>
        <input type="text" id="import-location" name="import-location" placeholder="Enter 'local' or import location" required>

        <button type="submit">Calculate</button>
    </form>

    <h2>Result:</h2>
    <p id="result"></p>

    <!-- Charts -->
    <div class="charts">
        <div class="chart-container">
            <h3>Carbon Footprint by Ingredient</h3>
            <canvas id="barChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>Carbon Footprint Distribution</h3>
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
