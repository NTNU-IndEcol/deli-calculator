<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - DELI Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.1/themes/base/jquery-ui.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6b8cbc;
            --success-color: #28a745;
            --error-color: #dc3545;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 20px;
        }
        
        .feedback-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            transition: transform 0.3s ease;
        }
        
        .feedback-card:hover {
            transform: translateY(-5px);
        }
        
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark-color);
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s ease;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 111, 165, 0.2);
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        
        .btn:hover {
            background-color: var(--secondary-color);
        }

        .btn-submit {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }
        
        .btn-submit:hover:not(:disabled) {
            background-color: var(--secondary-color);
        }

        .btn-submit:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            display: none;
        }
        
        .alert-success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }
        
        .alert-error {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }
        
        .required::after {
            content: " *";
            color: var(--error-color);
        }
        
        .form-row {
            display: flex;
            gap: 1rem;
        }
        
        .form-row .form-group {
            flex: 1;
        }

        .turnstile-container {
            margin: 1.5rem 0;
            display: flex;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-logo"></div>
        <span class="header-title">DELI Calculator</span>
        <nav class="nav-menu">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('recipes.recipes_list') }}">Recipes</a>
            <a href="{{ url_for('feedback') }}">Feedback</a>
            <a></a>
        </nav>
    </header>

    <div class="container">
        <div class="feedback-card">
            <h1>Send Us Your Feedback</h1>
            
            <div id="success-alert" class="alert alert-success">
                Thank you for your feedback! We appreciate your input.
            </div>
            
            <div id="error-alert" class="alert alert-error">
                There was an error submitting your feedback. Please try again.
            </div>
            
            <form id="feedback-form" action="{{ url_for('feedback') }}" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name" class="required">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="required">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="issue_type">Issue Type</label>
                    <select id="issue_type" name="issue_type">
                        <option value="bug">Bug Report</option>
                        <option value="feature">Feature Request</option>
                        <option value="suggestion">Suggestion</option>
                        <option value="other" selected>Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="subject" class="required">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                
                <div class="form-group">
                    <label for="message" class="required">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
           
                <div class="turnstile-container">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAB6-whGCiEQELBLc" data-callback="onSubmitTurnstile"></div>
                </div>

                <button type="submit" class="btn-submit" id="submitButton" disabled>
                    Send Feedback
                </button>
            </form>
        </div>
    </div>

    {% include 'footer.html' %}

    <script>
        function onSubmitTurnstile(token) {
            document.getElementById('submitButton').disabled = false;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('feedback-form');
            const alertSuccess = document.getElementById('success-alert');
            const alertError = document.getElementById('error-alert');
            const submitButton = document.getElementById('submitButton');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Show loading state
                submitButton.disabled = true;
                submitButton.textContent = 'Sending...';
                form.classList.add('loading');
                
                // Basic validation
                let isValid = true;
                const requiredFields = form.querySelectorAll('[required]');
                
                requiredFields.forEach(field => {
                    if (field.value.trim() === '') {
                        isValid = false;
                        field.style.borderColor = '#e74c3c';
                    } else {
                        field.style.borderColor = '#ddd';
                    }
                });
                
                if (!isValid) {
                    alertError.textContent = 'Please fill in all required fields.';
                    alertError.style.display = 'block';
                    alertSuccess.style.display = 'none';
                    
                    // Reset loading state
                    submitButton.disabled = false;
                    submitButton.textContent = 'Send Feedback';
                    form.classList.remove('loading');
                    
                    // Hide error after 5 seconds
                    setTimeout(() => {
                        alertError.style.display = 'none';
                    }, 5000);
                    return;
                }
                
                // Get form data
                const formData = new FormData(form);
                
                // Send to server
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        // Show success message
                        alertSuccess.style.display = 'block';
                        alertError.style.display = 'none';
                        
                        // Reset form
                        form.reset();
                        
                        // Reset Turnstile and disable button
                        if (typeof turnstile !== 'undefined') {
                            turnstile.reset();
                        }
                        submitButton.disabled = true;
                        submitButton.textContent = 'Send Feedback';
                        
                        // Hide success message after 5 seconds
                        setTimeout(() => {
                            alertSuccess.style.display = 'none';
                        }, 5000);
                    } else {
                        throw new Error(data.message || 'Submission failed');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alertError.textContent = 'There was an error sending your message. Please try again.';
                    alertError.style.display = 'block';
                    alertSuccess.style.display = 'none';
                    
                    // Hide error after 5 seconds
                    setTimeout(() => {
                        alertError.style.display = 'none';
                    }, 5000);
                })
                .finally(() => {
                    // Reset loading state
                    form.classList.remove('loading');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Send Feedback';
                });
            });
        });
    </script>
</body>
</html>
