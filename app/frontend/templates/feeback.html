<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - DELI Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.1/themes/base/jquery-ui.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
         .feedback-container {
            max-width: 1200px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 1.5rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .feedback-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #2c3e50;
            font-size: 1.8rem;
        }
        
        .feedback-subtitle {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #7f8c8d;
            font-size: 1rem;
        }
        
        .feedback-form {
            display: grid;
            gap: 1rem;
        }
        
        .form-group {
            display: flex;
            width: 60%;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #2c3e50;
        }
        
        .form-control {
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #9e2405;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }
        
        .btn-submit {
            background-color: #e6b11f;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 0.5rem;
        }
        
        .btn-submit:hover {
            background-color: #e2a351;
        }
        
        .alert {
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .required {
            color: #e74c3c;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .contact-info {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }
        
        .contact-info h3 {
            margin-bottom: 0.8rem;
            color: #2c3e50;
        }
        
        .contact-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        .contact-method {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        
        .contact-icon {
            width: 40px;
            height: 40px;
            background: #3498db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-logo"></div>
        <span class="header-title">DELI Calculator</span>
        <nav class="nav-menu">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('recipes_list') }}">Recipes</a>
            <a href="{{ url_for('feedback') }}">Feedback</a>
            <a></a>
        </nav>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search in site">
            <button id="search-btn">🔍</button>
        </div>
    </header>

    <div class="feedback-container">
        <h1 class="feedback-title">Send Us Your Feedback</h1>
        <p class="feedback-subtitle">We'd love to hear your thoughts, suggestions, or concerns</p>
        
        <div id="alert-success" class="alert alert-success">
            <i class="fas fa-check-circle"></i> Thank you for your feedback! We'll get back to you soon.
        </div>
        
        <div id="alert-error" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> There was an error sending your message. Please try again.
        </div>
        
        <form id="feedback-form" class="feedback-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Your Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Your Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="subject">Subject <span class="required">*</span></label>
                    <input type="text" id="subject" name="subject" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="issue-type">Issue Type</label>
                    <select id="issue-type" name="issue-type" class="form-control">
                        <option value="bug">Bug Report</option>
                        <option value="suggestion">Feature Suggestion</option>
                        <option value="calculation">Calculation Issue</option>
                        <option value="data">Data Accuracy</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                
            </div>
            
            <div class="form-group">
                <label for="message">Message <span class="required">*</span></label>
                <textarea id="message" name="message" class="form-control" required></textarea>
            </div>
            
            <div class="cf-turnstile" data-sitekey=0x4AAAAAAB6-whGCiEQELBLc data-size="flexible" data-callback="onSubmitTurnstile"></div>

            <button type="submit" class="btn-submit" id="submitButton" disabled>
                <i class="fas fa-paper-plane"></i> Send Feedback
            </button>
        </form>
        
    </div>

    {% include 'footer.html' %}

    <script>
        function onSubmitTurnstile(token) {
            document.getElementById('submitButton').disabled = false;
        }
    </script>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('feedback-form');
            const alertSuccess = document.getElementById('alert-success');
            const alertError = document.getElementById('alert-error');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Basic validation
                let isValid = true;
                const requiredFields = form.querySelectorAll('[required]');
                
                requiredFields.forEach(field => {
                    if (field.value.trim() === '') {
                        isValid = false;
                        field.style.borderColor = '#e74c3c';
                    } else {
                        field.style.borderColor = '#ddd';
                    }
                });
                
                if (!isValid) {
                    alertError.textContent = 'Please fill in all required fields.';
                    alertError.style.display = 'block';
                    alertSuccess.style.display = 'none';
                    
                    // Hide error after 5 seconds
                    setTimeout(() => {
                        alertError.style.display = 'none';
                    }, 5000);
                    return;
                }
                
                // In a real application, you would send the form data to a server here
                // For this example, we'll simulate a successful submission
                
                // Show success message
                alertSuccess.style.display = 'block';
                alertError.style.display = 'none';
                
                // Reset form
                form.reset();
                
                // Hide success message after 5 seconds
                setTimeout(() => {
                    alertSuccess.style.display = 'none';
                }, 5000);
            });
        });
    </script>
</body>
</html>
